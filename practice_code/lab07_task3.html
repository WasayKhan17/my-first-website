<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 3 - Prime Number Checker</title>
</head>
<body>
    <h2>Prime Number Checker - 24CCS051</h2>

    <script type="text/javascript">
        var num = parseInt(prompt("Enter Number:"));

        if (isNaN(num) || num <= 1) {
            alert(num + " is not prime");
        } else {
            var isPrime = true;
            // Check divisibility from 2 up to square root of num
            for (var i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) {
                    isPrime = false;
                    break;
                }
            }

            if (isPrime) {
                alert(num + " is a prime number");
            } else {
                alert(num + " is not prime");
            }
        }
    </script>
</body>
</html>
