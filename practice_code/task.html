<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date of Birth Form</title>
    <style>
        #form {
            height: auto;
            width: fit-content;
            background-color: bisque;
            padding: 40px;
            font-family: Arial, sans-serif;
        }
        table {
            border-spacing: 8px;
        }
        td {
            padding: 4px 0;
        }
        td:first-child {
            text-align: left;
            padding-right: 10px;
        }
        select {
            padding: 4px 8px;
            width: 120px;
        }
        .btn {
            padding: 5px 25px;
            margin-right: 10px;
            cursor: pointer;
        }
        .radio-group {
            display: inline-block;
        }
        .topups {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
        .scaleup {
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div id="form">
        <form>
            <table>
                <tr>
                    <td><label for="day">Day</label></td>
                    <td><input type="text" id="day" name="day" placeholder="Day"></td>
                </tr>
                <tr>
                    <td><label for="month">Month</label></td>
                    <td>
                        <select id="month" name="month">
                            <option value="january">January</option>
                            <option value="february">February</option>
                            <option value="march">March</option>
                            <option value="april">April</option>
                            <option value="may">May</option>
                            <option value="june">June</option>
                            <option value="july">July</option>
                            <option value="august">August</option>
                            <option value="september">September</option>
                            <option value="october">October</option>
                            <option value="november">November</option>
                            <option value="december">December</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="year">Year</label></td>
                    <td><input type="text" id="year" name="year" placeholder="Year"></td>
                </tr>
                <tr>
                    <td><label>Gender</label></td>
                    <td>
                        <input type="radio" name="gender" value="male"> Male
                        <input type="radio" name="gender" value="female"> Female
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label style="font-weight: bold;">Your date of birth</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label style="font-weight: bold;">Why we ask for this</label>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="button" value="Back" class="btn">
                        <input type="submit" value="Next" class="btn">
                    </td>
                </tr>
            </table>
        </form>

        <div class="scaleup">SCALEUP</div>
        <div class="topups">Topups</div>
    </div>

</body>

</html>
