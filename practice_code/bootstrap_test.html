<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Cards Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-4">
    <!-- row-gap/g-3 adds consistent spacing between cards when they wrap -->
    <div class="row g-2">
      
      <!-- Card 1 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Feature 1</h5>
            <p class="card-text">Description for feature card 1.</p>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Feature 2</h5>
            <p class="card-text">Description for feature card 2.</p>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Feature 3</h5>
            <p class="card-text">Description for feature card 3.</p>
          </div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Feature 4</h5>
            <p class="card-text">Description for feature card 4.</p>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
