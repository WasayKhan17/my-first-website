<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 4 - Pattern Printing</title>
</head>
<body>
    <h2>Star Pattern Output - 24CS051</h2>

    <script type="text/javascript">
        var rows = 5;

        // Nested loops to generate star pattern
        for (var i = 1; i <= rows; i++) {
            var pattern = "";
            for (var j = 1; j <= i; j++) {
                pattern += "* ";
            }
            document.write(pattern + "<br>");
        }
    </script>
</body>
</html>
