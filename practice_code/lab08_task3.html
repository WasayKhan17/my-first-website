<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 3 - Form Text Validation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form-group { margin-bottom: 12px; }
        label { display: inline-block; width: 120px; }
    </style>
</head>
<body>

    <h2>Student Information Form</h2>
    <form onsubmit="return validateStudentForm()">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label for="caste">Caste:</label>
            <input type="text" id="caste" required>
        </div>

        <div class="form-group">
            <label for="rollno">Roll No:</label>
            <input type="text" id="rollno" required placeholder="e.g. 24CS051">
        </div>

        <div class="form-group">
            <label for="dept">Department:</label>
            <input type="text" id="dept" required>
        </div>

        <button type="submit">Submit</button>
    </form>

    <script type="text/javascript">
        function validateStudentForm() {
            var name = document.getElementById("name").value.trim();
            var caste = document.getElementById("caste").value.trim();
            var dept = document.getElementById("dept").value.trim();

            // Pattern allowing letters and spaces only
            var textOnlyPattern = /^[A-Za-z\s]+$/;

            if (!textOnlyPattern.test(name) || !textOnlyPattern.test(caste) || !textOnlyPattern.test(dept)) {
                alert("Invalid data");
                return false; // Block submission
            }

            alert("Form submitted successfully!");
            return false; // Prevent default reload for demo
        }
    </script>

</body>
</html>
